<html lang="pt-BR">

<meta name="mobile-web-app-capable" content="yes">

<title>Ficha Forte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: uma coluna estreita de celular, barra de abas fixa embaixo, cores tiradas das anilhas de academia */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f4f6f9;
  --ink:#131a26; --ink-2:#465166; --ink-3:#8791a3; --line:#d7dde6;
  --accent:#1d4fd7; --accent-ink:#ffffff; --accent-soft:#e2e9fc;
  --ok:#1a8f4e; --ok-soft:#def3e7; --warn:#b97a00; --red:#cf332d; --vio:#6f45c9;
  --skin:#e6c6a6; --skin-far:#c8a688; --skin-line:#6f523d; --cloth:#2f3e5a; --cloth-far:#27334a; --shoe:#1d2433; --hair:#3b2a20; --hot:#e0402a; --hot-2:#f5a524; --mbody:#d3d9e2; --mus:#bcc4d0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1219; --surface:#171d28; --surface-2:#1e2633;
  --ink:#eef1f6; --ink-2:#aab3c3; --ink-3:#6f7a8e; --line:#2a3342;
  --accent:#7398ff; --accent-ink:#0a1124; --accent-soft:#1b2a50;
  --ok:#4dc98c; --ok-soft:#143524; --warn:#e6b545; --red:#ff6f66; --vio:#b196ff;
  --skin:#dcbb9b; --skin-far:#a98a70; --skin-line:#4d382a; --cloth:#52678f; --cloth-far:#3e4f70; --shoe:#c5cedd; --hair:#7a563f; --hot:#f2513a; --hot-2:#f5a524; --mbody:#343d4b; --mus:#465061;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1219; --surface:#171d28; --surface-2:#1e2633;
  --ink:#eef1f6; --ink-2:#aab3c3; --ink-3:#6f7a8e; --line:#2a3342;
  --accent:#7398ff; --accent-ink:#0a1124; --accent-soft:#1b2a50;
  --ok:#4dc98c; --ok-soft:#143524; --warn:#e6b545; --red:#ff6f66; --vio:#b196ff;
  --skin:#dcbb9b; --skin-far:#a98a70; --skin-line:#4d382a; --cloth:#52678f; --cloth-far:#3e4f70; --shoe:#c5cedd; --hair:#7a563f; --hot:#f2513a; --hot-2:#f5a524; --mbody:#343d4b; --mus:#465061;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);padding-inline:16px;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-block:14px 150px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;text-transform:uppercase} h2{font-size:24px;text-transform:uppercase} h3{font-size:20px}
p{margin:0}
.muted{color:var(--ink-2)} .small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.label{font:600 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:12px;padding:14px 18px;background:var(--accent);color:var(--accent-ink);font:600 17px/1 var(--body);min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--line)}
.btn.sm{min-height:40px;padding:9px 14px;font-size:15px}
.btn.wide{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px}
.back{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;font-size:22px;line-height:1;flex:none}
.brand{font:700 15px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

/* figura */
.fig{display:block;width:100%;height:auto}
.fig polyline,.fig line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .sk{fill:var(--skin)} .fig .skf{fill:var(--skin-far)} .fig .cl{fill:var(--cloth)} .fig .clf{fill:var(--cloth-far)}
.fig .sh{fill:var(--shoe)} .fig .hr{fill:var(--hair)} .fig .m1{fill:var(--hot)} .fig .m2{fill:var(--hot-2)}
.fig .ol{fill:var(--skin-line);stroke:var(--skin-line);stroke-width:1.5;stroke-linejoin:round}
.fig .sc{stroke:var(--line);stroke-width:3}
.fig .scf{fill:var(--line)}
.fig .cb{stroke:var(--ink-3);stroke-width:1.5}
.fig .eq{fill:var(--accent)}
.fig .bar{fill:var(--surface);stroke:var(--accent);stroke-width:4}
.stage{background:var(--surface-2);border-radius:var(--r);position:relative;overflow:hidden}
.stage .play{position:absolute;right:10px;bottom:10px}
.fig .eql{stroke:var(--accent);stroke-width:3.5;stroke-linecap:round}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;font-size:15px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
.mrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:center}
.mmap{width:100%;height:auto;display:block}
.mmap .bb{fill:var(--mbody)} .mmap .m0{fill:var(--mus);stroke:var(--mbody);stroke-width:.8} .mmap .m1{fill:var(--hot);stroke:var(--mbody);stroke-width:.8} .mmap .m2{fill:var(--hot-2);stroke:var(--mbody);stroke-width:.8}
.mmap text{fill:var(--ink-3);font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase}
.mleg{display:flex;flex-direction:column;gap:12px;font-size:15px;min-width:0}
.mleg .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;background:var(--hot)} .mleg .sw.m2{background:var(--hot-2)}
.thumb{width:64px;flex:none;background:var(--surface-2);border-radius:10px}

/* formulario */
.field{display:flex;flex-direction:column;gap:8px}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:48px;font-size:17px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chips span{display:block;padding:11px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:15px}
.chips input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.hero{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center}
.err{color:var(--red);font-weight:500}

/* treino */
.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.next .label,.next .muted{color:inherit;opacity:.8}
.next .btn{background:var(--accent-ink);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px}
.stat b{font:700 30px/1 var(--display)}
.daybtn,.exrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.daybtn .ltr{font:700 30px/1 var(--display);width:44px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.daybtn.is-next .ltr{background:var(--accent);color:var(--accent-ink)}
.list{display:flex;flex-direction:column;gap:8px}
.exrow .t{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.exrow .nm{font-weight:600;line-height:1.2}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-3)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.chip{display:inline-block;font:600 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:6px;border:1.5px solid currentColor}
.g-Peito{color:var(--red)} .g-Costas{color:var(--accent)} .g-Pernas,.g-Glúteos{color:var(--ok)} .g-Ombros{color:var(--warn)} .g-Braços{color:var(--vio)} .g-Abdômen,.g-Cardio{color:var(--ink-2)}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.meta div{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px}
.meta b{font:700 24px/1 var(--display)}
.tip{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px;font-weight:500}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center}
.set .i{font:700 22px/1 var(--display);color:var(--ink-3);text-align:center}
.set .inp{text-align:center;padding:10px 6px}
.set .ck{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;color:var(--ink-3)}
.set.ok .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.set.ok .inp{background:var(--ok-soft);border-color:transparent}
.set.bad .rp{border-color:var(--red)}
.sethead{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;text-align:center}
ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.hist{display:flex;justify-content:space-between;gap:10px;padding-block:8px;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
.chart{width:100%;height:auto;display:block}
.chart polyline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart circle{fill:var(--accent)} .chart text{fill:var(--ink-2);font:500 11px var(--body)}
.chart line{stroke:var(--line);stroke-width:1}

/* barras fixas */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;padding:14px 2px 12px;font:600 12px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.rest{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.rest b{font:700 30px/1 var(--display);min-width:64px}
.rest .grow{flex:1;min-width:0;font-weight:500}
.rest button{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:10px;padding:8px 10px;font-weight:600;font-size:14px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;line-height:1.45;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.sug{display:flex;flex-direction:column;gap:8px}
.sug button{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:500;color:var(--accent)}
.chatf{display:flex;gap:8px;align-items:flex-end}
.chatf textarea{flex:1;min-width:0;resize:none;font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:50px}
.linkbtn{background:none;border:0;color:var(--ink-2);text-decoration:underline;padding:6px 0;font-size:14px;align-self:flex-start}
select.inp{appearance:auto}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:9;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:500;text-align:center}
@media (max-width:360px){.hero{grid-template-columns:1fr}.hero .stage{display:none}}
</style>
</head>
<body>
<main id="app"></main>

function ik(a,b,l1,l2,hint){
  let dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||.001;const ux=dx/d,uy=dy/d;

  return{r:a,j:[a[0]+ux*p+px*h,a[1]+uy*p+py*h],e:[a[0]+ux*d,a[1]+uy*d]};
}

const TPL={
 fullA:{foco:'Corpo todo',slots:['quad','push_h','pull_h','hinge','push_v','core','biceps','triceps']},

function splitFor(p,lvl){
  const d=p.dias,f=p.foco;
  if(p.local==='B'||d<=2||(d===3&&lvl===0))return Array.from({length:d},(_,i)=>['fullA','fullB','fullC'][i%3]);
  const T={
    3:{eq:['push','pull','legs'],inf:['loA','upA','loB'],sup:['upA','loA','upB']},
    4:{eq:['upA','loA','upB','loB'],inf:['loA','upA','glu','upB'],sup:['push','pull','loA','upA']},
    5:{eq:['push','pull','legs','upA','loB'],inf:['loA','upA','glu','upB','loB'],sup:['push','pull','loA','upA','upB']},
    6:{eq:['push','pull','legs','push','pull','loB'],inf:['loA','push','glu','pull','loB','upA'],sup:['push','pull','loA','push','pull','upA']}
  };
  return T[d][f]||T[d].eq;
}
function cands(slot,p,lvl,ids){return EX.filter(e=>e.s.includes(slot)&&e.w.includes(p.local)&&(e.min||0)<=lvl&&!(e.av||[]).some(a=>p.evita.includes(a))&&!ids.has(e.id))}
function allCands(slot,p,lvl,ids){const c=cands(slot,p,lvl,ids);if(FALL[slot])for(const e of cands(FALL[slot],p,lvl,ids))if(!c.includes(e))c.push(e);return c}
const LVL={ini:0,int:1,ava:2};
function prescr(e,slot,p,lvl){
  const comp=COMP.includes(slot),old=p.idade>=50;
  const R={massa:[[8,12],90,[10,15],60],emag:[[12,15],45,[15,20],40],def:[[10,12],60,[12,15],45],saude:[[10,15],60,[12,15],60]}[p.objetivo];
  let series=comp?[3,3,4][lvl]:[2,3,3][lvl],reps=comp?R[0]:R[2],desc=comp?R[1]:R[3];
  if(e.t){reps=e.id==='prancha'?[[20,30],[30,45],[45,60]][lvl]:[30,40];desc=40;series=3}
  else if(slot==='core'){reps=[12,20];desc=40}
  if(old){series=Math.min(series,3);desc+=15}
  return{ex:e.id,slot,series,reps,desc};
}
function buildPlan(p){
  const lvl=LVL[p.nivel],n={30:4,45:5,60:7,75:8}[p.tempo],use={};
  const imc=p.peso/Math.pow(p.altura/100,2);
  return splitFor(p,lvl).map((key,i)=>{
    const T=TPL[key];let slots=T.slots.slice();
    if(p.foco==='inf'&&key.startsWith('full'))slots.splice(1,0,'glute');
    const ids=new Set(),itens=[];
    for(const slot of slots){
      if(itens.length>=n)break;
      let c=cands(slot,p,lvl,ids);if(!c.length)c=allCands(slot,p,lvl,ids);if(!c.length)continue;
      const k=use[slot]||0;use[slot]=k+1;const e=c[k%c.length];
      ids.add(e.id);itens.push(prescr(e,slot,p,lvl));
    }
    let nota='';
    if(p.objetivo==='emag'){
      if(p.local==='B'&&imc<30&&!p.evita.includes('joelho'))itens.push(prescr(EXM.polichinelo,'cardio',p,lvl));
      else nota=p.local==='G'?'Para fechar: 10 a 15 minutos de esteira, bicicleta ou escada.':'Para fechar: 15 a 20 minutos de caminhada rápida.';
    }
    return{nome:'Treino '+String.fromCharCode(65+i),foco:T.foco,itens,nota};
  });
}
const mins=d=>{const s=d.itens.reduce((a,it)=>a+it.series*(45+it.desc),0);return Math.max(15,Math.round((s/60+5)/5)*5)};
const repTxt=it=>EXM[it.ex].t?`${it.reps[0]} a ${it.reps[1]} s`:`${it.reps[0]} a ${it.reps[1]}`;

function weekCount(){const d=new Date(),k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);const m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return S.done.filter(x=>x.d>=m).length}
function setsOf(d,it){const dd=S.draft[d]||(S.draft[d]={});let a=dd[it.ex];
  if(!a||a.length!==it.series){const sg=suggest(it);a=Array.from({length:it.series},()=>({kg:sg.kg!=null?fmtKg(sg.kg):'',reps:String(sg.reps),ok:false}));dd[it.ex]=a}
  else if(a.some(x=>!x.ok&&(x.reps===''||x.kg===''))){const sg=suggest(it);a.forEach(x=>{if(x.ok)return;if(x.reps==='')x.reps=String(sg.reps);if(x.kg===''&&sg.kg!=null)x.kg=fmtKg(sg.kg)})}
  return a}
const lastLog=id=>{const l=S.logs[id];return l&&l.length?l[l.length-1]:null};
// carga inicial: fracao do peso do corpo para um homem iniciante, por exercicio
const START={agach_barra:.5,leg_press:1,agach_goblet:.15,stiff_halter:.12,stiff_barra:.4,terra:.6,elev_pelvica:.5,afundo_h:.08,bulgaro:.07,extensora:.3,flexora:.25,panturrilha:.12,supino_barra:.4,supino_halter:.14,supino_chao:.14,supino_incl:.12,crossover:.08,desenv:.09,elev_lateral:.04,puxada:.45,remada_baixa:.4,remada_uni:.15,remada_curv:.35,face_pull:.2,rosca_barra:.2,rosca_halter:.07,martelo:.07,triceps_polia:.2,triceps_testa:.05};
function roundKg(e,v){if(e.eq==='db')return v<10?Math.max(2,Math.round(v)):Math.round(v/2)*2;if(e.eq==='bar')return Math.max(10,Math.round(v/2.5)*2.5);return Math.max(5,Math.round(v/5)*5)}
function startKg(e,it){const p=S.profile,f=START[e.id];if(!f)return null;
  let v=f*Math.min(95,Math.max(45,p.peso))*[1,1.4,1.8][LVL[p.nivel]]*(p.sexo==='f'?.65:1)*(p.idade>=50?.85:1)*(it.reps[1]>=15?.85:1);
  return roundKg(e,v)}
const kgUnit=e=>e.eq==='db'?'kg por halter':e.eq==='bar'?'kg com a barra':'kg';
function suggest(it){
  const e=EXM[it.ex],last=lastLog(it.ex),lo=it.reps[0],hi=it.reps[1];
  if(e.t){
    if(!last)return{kg:null,reps:lo,txt:`Segure ${lo} segundos em cada série, sem perder a postura.`};
    const m=Math.min(...last.sets.map(s=>s.reps)),r=m>=hi?m+5:Math.min(hi,m+5);
    return{kg:null,reps:r,txt:`Da última vez você segurou ${m} segundos. Hoje tente ${r}.`};
  }
  const kgs=last?last.sets.map(s=>s.kg).filter(k=>k>0):[],kg=kgs.length?Math.max(...kgs):null;
  if(kg==null){
    const est=e.bw?null:startKg(e,it);
    if(!last||est!=null){const r=Math.min(hi,lo+2);
      return est!=null?{kg:est,reps:r,txt:`Para começar: ${fmtKg(est)} ${kgUnit(e)}, ${r} repetições. É uma estimativa pelo seu peso e experiência. Se ficar fácil demais, suba. Se não chegar em ${lo}, baixe.`}
        :{kg:null,reps:lo,txt:`Para começar: ${lo} repetições em cada série, sem peso. Se ficar fácil, faça mais devagar.`}}
    const m=Math.min(...last.sets.map(s=>s.reps)),r=m>=hi?hi:Math.max(lo,m+1);
    return{kg:null,reps:r,txt:m>=hi?`Você já faz ${hi} em todas. Faça mais devagar ou segure um peso.`:`Da última vez você fez ${m}. Hoje tente ${r} em cada série.`};
  }
  const m=Math.min(...last.sets.map(s=>s.reps));
  if(last.sets.length>=it.series&&m>=hi){const up=Math.max(kg+1,roundKg(e,kg*1.05));return{kg:up,reps:lo,txt:`Você fez ${hi} em todas as séries com ${fmtKg(kg)} kg. Hoje suba para ${fmtKg(up)} ${kgUnit(e)} e faça ${lo} repetições.`}}
  if(m<lo){const dn=Math.min(kg,Math.max(1,roundKg(e,kg*.9)));return{kg:dn,reps:lo,txt:`Da última vez ficou pesado. Hoje use ${fmtKg(dn)} ${kgUnit(e)} e faça ${lo} repetições.`}}
  const r=Math.min(hi,m+1);
  return{kg,reps:r,txt:`Fique em ${fmtKg(kg)} ${kgUnit(e)} e faça ${r} repetições em cada série.`};
}

function chart(vals,labels){
  const W=320,H=110,pl=8,pr=8,pt=22,pb=22,mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;
  const X=i=>pl+(W-pl-pr)*(vals.length===1?.5:i/(vals.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/sp);
  const n=vals.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${fmtKg(vals[0])} até ${fmtKg(vals[n])} kg"><line x1="${pl}" y1="${H-pb+6}" x2="${W-pr}" y2="${H-pb+6}"/>
  <polyline points="${vals.map((v,i)=>r1(X(i))+','+r1(Y(v))).join(' ')}"/><circle cx="${r1(X(0))}" cy="${r1(Y(vals[0]))}" r="3.5"/><circle cx="${r1(X(n))}" cy="${r1(Y(vals[n]))}" r="5"/>
  <text x="${pl}" y="${Math.max(11,Y(vals[0])-9)}">${fmtKg(vals[0])} kg</text>${n?`<text x="${W-pr}" y="${Math.max(11,Y(vals[n])-10)}" text-anchor="end">${fmtKg(vals[n])} kg</text>`:''}
  <text x="${pl}" y="${H-3}">${labels[0]}</text>${n?`<text x="${W-pr}" y="${H-3}" text-anchor="end">${labels[n]}</text>`:''}</svg>`;
}

const cfg=()=>{try{return JSON.parse(localStorage.getItem(CFGKEY))||{}}catch(e){return{}}};
const setCfg=c=>{try{localStorage.setItem(CFGKEY,JSON.stringify(c))}catch(e){}};
const AIERR={no_key:'Falta a chave API. Coloque em Meus dados.',bad_key:'A chave API não foi aceita. Confira em Meus dados.',need_ws:'A API pediu o Workspace ID. Preencha em Meus dados.',rate_limited:'Muitas perguntas seguidas. Espere um pouco e tente de novo.',no_credit:'Sua conta da API está sem crédito.',network:'Não consegui falar com a IA. Confira a internet. Dentro do Claude o treinador não funciona, só no app publicado.',empty:'A IA não respondeu. Tente de novo.',upstream_error:'A IA deu erro. Tente de novo daqui a pouco.'};
const aiErr=e=>AIERR[e&&e.code]||AIERR.upstream_error;
let aiBusy=false,chatDraft='';
async function callAI(messages,{system,onText,max=1500}={}){
  const c=cfg();if(!c.key)throw{code:'no_key'};
  const headers={'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  if(c.ws)headers['anthropic-workspace-id']=c.ws;
  let res;
  try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify({model:c.model||'claude-sonnet-5-5',max_tokens:max,stream:true,system,messages})})}
  catch(e){throw{code:'network'}}
  if(!res.ok){let m='';try{m=(await res.json()).error.message||''}catch(e){}
    throw{code:/workspace/i.test(m)?'need_ws':res.status===401||res.status===403?'bad_key':res.status===429||res.status===529?'rate_limited':/credit/i.test(m)?'no_credit':'upstream_error',message:m}}
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='',text='';
  try{for(;;){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,i);buf=buf.slice(i+2);const line=chunk.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
      let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
      if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text;if(onText)onText(text)}
      else if(ev.type==='error')throw{code:'upstream_error'}}}}
  catch(e){if(e&&e.code)throw e;throw{code:'network'}}
  if(!text.trim())throw{code:'empty'};
  return text;
}
function aiSystem(){
  const p=S.profile,L={massa:'ganhar massa',emag:'emagrecer',def:'definir',saude:'saúde e disposição',ini:'menos de 6 meses',int:'6 meses a 2 anos',ava:'mais de 2 anos',G:'academia',D:'casa com halteres',B:'casa sem equipamento',eq:'corpo todo',inf:'pernas e glúteos',sup:'parte de cima'};
  const dados={hoje:today(),pessoa:{nome:p.nome||undefined,sexo:p.sexo==='f'?'mulher':'homem',idade:p.idade,peso_kg:p.peso,altura_cm:p.altura,objetivo:L[p.objetivo],experiencia:L[p.nivel],dias_por_semana:p.dias,minutos_por_treino:p.tempo,local:L[p.local],foco:L[p.foco],evitar_forcar:p.evita},
    treino_da_semana:S.plan.map(d=>({nome:d.nome,foco:d.foco,exercicios:d.itens.map(it=>({nome:EXM[it.ex].n,series:it.series,meta:repTxt(it),descanso_s:it.desc}))})),
    historico_de_cargas:Object.keys(S.logs).filter(id=>EXM[id]).map(id=>({exercicio:EXM[id].n,ultimas_vezes:S.logs[id].slice(-4).map(x=>({data:x.d,series:x.sets.map(s=>(s.kg?s.kg+' kg x ':'')+s.reps).join(', ')}))})),
    treinos_feitos:S.done.slice(-14),treinos_nesta_semana:weekCount(),pesos_anotados:S.pesos.slice(-10)};
  return `Você é o treinador do app de musculação Ficha Forte. Responda em português do Brasil, com palavras simples e frases curtas, sem travessão. Seja direto: no máximo 6 linhas, a não ser que a pessoa peça mais detalhe. Use os dados abaixo, que são desta pessoa. Elogie o que evoluiu e cobre o que ficou parado, sem bronca exagerada. Não invente números que não estão no histórico. Se o histórico estiver vazio, diga isso e oriente a anotar os treinos.
Limites: você não é médico nem fisioterapeuta. Não dê diagnóstico. Em caso de dor forte, dor que não passa, tontura ou suspeita de lesão, mande parar o exercício e procurar um profissional. Não recomende remédios, hormônios ou anabolizantes. Para dieta, dê só orientação geral.
DADOS:
${JSON.stringify(dados)}`;
}
const fmtAI=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*/gm,'').replace(/\n/g,'<br>');
const SUGS=['Como foi minha evolução até agora?','Meu treino está bom para o meu objetivo?','Qual exercício eu deveria dar mais atenção?','Posso treinar dois dias seguidos?'];
function viewIA(){
  const has=!!cfg().key;
  return `
  <div class="top"><span class="brand">Ficha Forte</span></div><h1>Treinador</h1>
  ${has?`<p class="muted">Pergunte o que quiser. Ele conhece seus dados, seu treino e as cargas que você anotou.</p>
  <div class="chat" id="chat">${S.chat.map(m=>`<div class="msg ${m.r}">${m.r==='a'?fmtAI(m.t):esc(m.t).replace(/\n/g,'<br>')}</div>`).join('')}</div>
  ${S.chat.length?'':`<div class="sug">${SUGS.map(q=>`<button type="button" data-act="sug">${q}</button>`).join('')}</div>`}
  <form class="chatf" id="chatf"><textarea id="chat-in" rows="2" aria-label="Sua pergunta" placeholder="Escreva sua pergunta">${esc(chatDraft)}</textarea><button class="btn" type="submit">Enviar</button></form>
  ${S.chat.length?'<button class="linkbtn" type="button" data-act="chatClear">Limpar conversa</button>':''}`
  :`<section class="card"><p>O treinador é uma IA que responde suas dúvidas e analisa sua evolução com base no que você anotou.</p><p class="muted">Para ligar, coloque sua chave API da Anthropic em Meus dados. É a mesma chave do Diário Nutri.</p><button class="btn wide" type="button" data-act="goCfg">Colocar a chave</button></section>`}`;
}
function chatBottom(){const c=document.getElementById('chat');if(c&&c.lastElementChild)c.lastElementChild.scrollIntoView({block:'end'})}
async function sendChat(q){
  q=(q||'').trim();if(!q||aiBusy)return;aiBusy=true;chatDraft='';
  S.chat.push({r:'u',t:q});S.chat.push({r:'a',t:''});if(S.chat.length>40)S.chat=S.chat.slice(-40);
  const msgs=S.chat.slice(0,-1).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));
  render();
  const live=()=>{const c=document.getElementById('chat');return V.name==='ia'&&c?c.lastElementChild:null};
  let el=live();if(el)el.textContent='Pensando...';
  try{const t=await callAI(msgs,{system:aiSystem(),onText:x=>{const e=live();if(e){e.innerHTML=fmtAI(x);e.scrollIntoView({block:'end'})}}});S.chat[S.chat.length-1].t=t}
  catch(e){S.chat.pop();S.chat.pop();chatDraft=q;toast(aiErr(e))}
  aiBusy=false;save();if(V.name==='ia')render();
}
async function runAnalise(){
  if(aiBusy)return;if(!cfg().key){go({name:'ia'});return}
  aiBusy=true;const box=document.getElementById('ana');if(box)box.textContent='Analisando...';
  try{const t=await callAI([{role:'user',content:'Analise minha evolução. Diga o que evoluiu, o que travou, se estou cumprindo os dias da semana e termine com 3 ajustes práticos para a próxima semana. No máximo 12 linhas.'}],{system:aiSystem(),max:2000,onText:x=>{const b=document.getElementById('ana');if(b)b.innerHTML=fmtAI(x)}});
    S.analise={d:today(),t};save()}
  catch(e){toast(aiErr(e))}
  aiBusy=false;if(V.name==='evo')render();
}
function cfgCard(){const c=cfg();
  return `<section class="card" id="cfg"><span class="label">Treinador com IA</span>
    <div class="field"><label class="small muted" for="api-key">Chave API da Anthropic</label><input class="inp" id="api-key" type="password" autocomplete="off" placeholder="sk-ant-..." value="${esc(c.key||'')}"></div>
    <div class="field"><label class="small muted" for="api-ws">Workspace ID (só se a API pedir)</label><input class="inp" id="api-ws" autocomplete="off" value="${esc(c.ws||'')}"></div>
    <div class="field"><label class="small muted" for="api-model">Modelo</label><select class="inp" id="api-model">${[['claude-sonnet-5-5','Sonnet 5.5 (recomendado)'],['claude-haiku-4-5-20251001','Haiku 4.5 (mais barato e rápido)'],['claude-opus-5-5','Opus 5.5 (mais caprichado, mais caro)']].map(o=>`<option value="${o[0]}"${(c.model||'claude-sonnet-5-5')===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div>
    <div class="row"><button class="btn grow" type="button" data-act="cfgSave">Salvar</button><button class="btn ghost grow" type="button" data-act="cfgTest">Testar chave</button></div>
    <p class="small muted" id="cfg-msg">A chave fica guardada só neste celular. Ela não vai para o GitHub.</p></section>
  <section class="card"><span class="label">Backup</span><p class="small muted">Baixe um arquivo com seu histórico para não perder nada ou para passar para outro celular.</p>
    <div class="row"><button class="btn ghost grow" type="button" data-act="backup">Baixar backup</button><label class="btn ghost grow" for="restore">Restaurar backup</label><input type="file" id="restore" accept="application/json,.json" hidden></div></section>`;
}
function saveCfgForm(){const k=document.getElementById('api-key');if(!k)return;setCfg({...cfg(),key:k.value.trim(),ws:document.getElementById('api-ws').value.trim(),model:document.getElementById('api-model').value})}

/* ============ ACOES ============ */
function readSets(){ if(V.name!=='ex')return;const it=S.plan[V.d].itens[V.i],st=setsOf(V.d,it);
  app.querySelectorAll('.set').forEach(row=>{const k=+row.dataset.k,kg=row.querySelector('.kg'),rp=row.querySelector('.rp');if(kg)st[k].kg=kg.value;st[k].reps=rp.value});save()}
app.addEventListener('input',e=>{if(e.target.closest('.set'))readSets();else if(e.target.id==='chat-in')chatDraft=e.target.value});
app.addEventListener('change',e=>{if(e.target.id!=='restore'||!e.target.files[0])return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.profile||!Array.isArray(d.plan))throw 0;S=Object.assign({profile:null,plan:[],next:0,draft:{},logs:{},done:[],pesos:[],chat:[],analise:null},d);save();go({name:'home'});toast('Backup restaurado.')}catch(x){toast('Esse arquivo não é um backup do Ficha Forte.')}};rd.readAsText(e.target.files[0])});
app.addEventListener('submit',e=>{
  e.preventDefault();if(e.target.id==='chatf'){sendChat(document.getElementById('chat-in').value);return}
  const f=e.target,g=n=>(f.querySelector(`input[name="${n}"]:checked`)||{}).value,err=document.getElementById('f-err');
  const idade=num(document.getElementById('f-idade').value),peso=num(document.getElementById('f-peso').value),altura=num(document.getElementById('f-altura').value);
  const bad=!g('sexo')?'Marque homem ou mulher. Isso ajuda a sugerir a carga certa.':!idade||idade<14||idade>90?'Coloque sua idade (de 14 a 90 anos).':!peso||peso<35||peso>250?'Coloque seu peso em kg (exemplo: 72).':!altura||altura<130||altura>220?'Coloque sua altura em centímetros (exemplo: 170).':'';
  if(bad){err.textContent=bad;err.hidden=false;err.scrollIntoView({block:'center'});return}
  const first=!S.profile,old=S.profile||{},keep=!old.sexo&&['objetivo','nivel','dias','tempo','local','foco'].every(k=>String(old[k])===String(g(k)))&&String(old.evita)===String([...f.querySelectorAll('input[name="evita"]:checked')].map(x=>x.value));
  S.profile={nome:document.getElementById('f-nome').value.trim(),sexo:g('sexo'),idade,peso,altura,objetivo:g('objetivo'),nivel:g('nivel'),dias:+g('dias'),tempo:+g('tempo'),local:g('local'),foco:g('foco'),evita:[...f.querySelectorAll('input[name="evita"]:checked')].map(x=>x.value)};
  if(first||!keep){S.plan=buildPlan(S.profile);S.next=0;S.draft={}}
  if(first&&!S.pesos.length)S.pesos.push({d:today(),kg:peso});
  save();editing=false;go({name:'home'});toast(first?'Treino montado. Bom treino!':keep?'Dados salvos.':'Treino montado de novo.');
});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='home')go({name:'home'});
  else if(a==='day')go({name:'day',d:+b.dataset.d});
  else if(a==='ex')go({name:'ex',d:+b.dataset.d,i:+b.dataset.i});
  else if(a==='view'){V.view=+b.dataset.v;render()}
  else if(a==='play'){playing=!playing;b.textContent=playing?'Pausar':'Ver movimento'}
  else if(a==='check'){
    readSets();const it=S.plan[V.d].itens[V.i],st=setsOf(V.d,it),k=+b.dataset.k,s=st[k];
    if(!s.ok&&!(num(s.reps)>0)){const row=b.closest('.set');row.classList.add('bad');row.querySelector('.rp').focus();toast(EXM[it.ex].t?'Anote quantos segundos você segurou.':'Anote quantas repetições você fez.');return}
    s.ok=!s.ok;save();render();
    if(s.ok){if(st.every(x=>x.ok)){stopRest();toast('Exercício completo!')}else startRest(it.desc)}
  }
  else if(a==='swap'){
    const day=S.plan[V.d],it=day.itens[V.i],p=S.profile,lvl=LVL[p.nivel],ids=new Set(day.itens.map(x=>x.ex));
    const pool=EX.filter(x=>x.id===it.ex||allCands(it.slot,p,lvl,ids).includes(x));
    if(pool.length<2){toast('Não achei outro exercício parecido para o seu local de treino.');return}
    const nx=pool[(pool.findIndex(x=>x.id===it.ex)+1)%pool.length];
    if(S.draft[V.d])delete S.draft[V.d][it.ex];
    day.itens[V.i]=prescr(nx,it.slot,p,lvl);V.view=0;save();render();toast('Trocado por '+nx.n+'.');
  }
  else if(a==='finish'){
    const d=+b.dataset.d,day=S.plan[d];let any=false;
    day.itens.forEach(it=>{const st=(S.draft[d]||{})[it.ex]||[],sets=st.filter(s=>s.ok&&num(s.reps)>0).map(s=>({kg:num(s.kg)||0,reps:num(s.reps)}));
      if(sets.length){any=true;(S.logs[it.ex]=S.logs[it.ex]||[]).push({d:today(),sets})}});
    if(!any){toast('Marque pelo menos uma série como feita antes de concluir.');return}
    S.done.push({d:today(),n:day.nome+' · '+day.foco});delete S.draft[d];S.next=(d+1)%S.plan.length;stopRest();save();go({name:'home'});toast('Treino concluído. Mandou bem!');
  }
  else if(a==='addPeso'){const v=num(document.getElementById('peso-novo').value);if(!v||v<35||v>250){toast('Coloque o peso em kg (exemplo: 72,5).');return}
    const t=today(),i=S.pesos.findIndex(x=>x.d===t);if(i>=0)S.pesos[i].kg=v;else S.pesos.push({d:t,kg:v});S.profile.peso=v;save();render();toast('Peso salvo.')}
  else if(a==='edit'){editing=true;render();window.scrollTo(0,0)}
  else if(a==='cancelEdit'){editing=false;render()}
  else if(a==='sug')sendChat(b.textContent);
  else if(a==='chatClear'){S.chat=[];save();render()}
  else if(a==='goCfg'){go({name:'perfil'});const c=document.getElementById('cfg');if(c)c.scrollIntoView()}
  else if(a==='analise')runAnalise();
  else if(a==='askEx'){chatDraft='Sobre o exercício '+EXM[S.plan[V.d].itens[V.i].ex].n+': ';go({name:'ia'});const t=document.getElementById('chat-in');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
  else if(a==='cfgSave'){saveCfgForm();document.getElementById('cfg-msg').textContent=cfg().key?'Salvo neste celular.':'Chave apagada.'}
  else if(a==='cfgTest'){saveCfgForm();const m=document.getElementById('cfg-msg');m.textContent='Testando...';callAI([{role:'user',content:'Responda só: ok'}],{max:50}).then(()=>{const x=document.getElementById('cfg-msg');if(x)x.textContent='Funcionou. A chave está ok.'}).catch(er=>{const x=document.getElementById('cfg-msg');if(x)x.textContent=aiErr(er)+(er&&er.message?' ('+er.message+')':'')})}
  else if(a==='backup'){const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='ficha-forte-backup-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),2000);toast('Backup baixado.')}
  else if(a==='del'){confirmDel=true;render()}
  else if(a==='delNo'){confirmDel=false;render()}
  else if(a==='delYes'){S={profile:null,plan:[],next:0,draft:{},logs:{},done:[],pesos:[],chat:[],analise:null};try{localStorage.removeItem(KEY)}catch(x){}confirmDel=false;V={name:'home'};render()}
});
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go({name:b.dataset.tab})});

/* ============ DESCANSO ============ */
const restEl=document.getElementById('rest'),restT=document.getElementById('restT'),restL=document.getElementById('restL');
let restEnd=0,restInt=null,actx=null;
function startRest(s){restEnd=Date.now()+s*1000;restEl.hidden=false;restL.textContent='Descanso';try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}clearInterval(restInt);restInt=setInterval(tickRest,250);tickRest()}
function stopRest(){clearInterval(restInt);restEl.hidden=true}
function tickRest(){const left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){clearInterval(restInt);restT.textContent='0:00';restL.textContent='Bora para a próxima série!';beep();setTimeout(()=>{if(Date.now()>=restEnd)restEl.hidden=true},4000);return}
  restT.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}
function beep(){try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.5);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.5)}catch(e){}}
document.getElementById('restAdd').addEventListener('click',()=>{restEnd=Math.max(restEnd,Date.now())+15000;restL.textContent='Descanso';clearInterval(restInt);restInt=setInterval(tickRest,250);tickRest()});
document.getElementById('restSkip').addEventListener('click',stopRest);

/* ============ LACO DA ANIMACAO ============ */
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function frame(now){
  if(playing){const c=(now%2800)/2800;let t=c<.42?ease(c/.42):c<.5?1:c<.92?1-ease((c-.5)/.42):0;
    document.querySelectorAll('svg.fig.live').forEach(el=>{const e=EXM[el.dataset.ex];if(e)el.innerHTML=figSVG(animOf(e,+el.dataset.v),t,e)})}
  requestAnimationFrame(frame);
}
if(S.profile&&!S.profile.sexo)editing=true;
render();requestAnimationFrame(frame);
</script>
